[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "singleserver"
version = "0.1.0"
description = "Manage singleton server processes across multiple workers using atomic socket binding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Johanna Mae Dimayuga", email = "johanna@techco.fi" },
]
keywords = [
    "server",
    "singleton",
    "process",
    "multiprocess",
    "coordination",
    "gunicorn",
    "django",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
unix-sockets = [
    "requests-unixsocket>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/Technology-Company/singleserver"
Documentation = "https://github.com/Technology-Company/singleserver#readme"
Repository = "https://github.com/Technology-Company/singleserver"
Issues = "https://github.com/Technology-Company/singleserver/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/singleserver"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--timeout=60",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["singleserver"]

[tool.coverage.run]
source = ["src/singleserver"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
